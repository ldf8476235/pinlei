name: category-analysis-plus

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: category-analysis-sqlserver
    environment:
      TZ: Asia/Shanghai
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      SA_PASSWORD: ${DIAG_SQLSERVER_PASSWORD:-Diag@123456}
    ports:
      - "${DIAG_SQLSERVER_PORT:-1433}:1433"
    volumes:
      - ./volumes/sqlserver/data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$${SA_PASSWORD}\" -Q \"SELECT 1\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks:
      - category-analysis

  redis:
    image: redis:7.2.8
    container_name: category-analysis-redis
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./redis/conf/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./volumes/redis/data:/redis/data
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - category-analysis

  category-analysis-server:
    build:
      context: ../..
      dockerfile: category-analysis-admin/Dockerfile
    image: category-analysis/category-analysis-server:local
    container_name: category-analysis-server
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: ${SERVER_PORT:-8080}
      SNAIL_PORT: ${APP_SNAIL_PORT:-28080}
      DIAG_SQLSERVER_HOST: sqlserver
      DIAG_SQLSERVER_PORT: 1433
      DIAG_SQLSERVER_DB: ${DIAG_SQLSERVER_DB:-diagnosis}
      DIAG_SQLSERVER_USER: ${DIAG_SQLSERVER_USER:-sa}
      DIAG_SQLSERVER_PASSWORD: ${DIAG_SQLSERVER_PASSWORD:-Diag@123456}
      DIAG_SQLSERVER_ENCRYPT: ${DIAG_SQLSERVER_ENCRYPT:-false}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-ruoyi123}
      SPRING_BOOT_ADMIN_CLIENT_ENABLED: ${SPRING_BOOT_ADMIN_CLIENT_ENABLED:-false}
      SNAIL_JOB_ENABLED: ${SNAIL_JOB_ENABLED:-false}
      JUSTAUTH_ADDRESS: ${JUSTAUTH_ADDRESS:-http://localhost}
      JAVA_OPTS: ${SERVER_JAVA_OPTS:--Xms1g -Xmx1g}
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
      - "${APP_SNAIL_PORT:-28080}:${APP_SNAIL_PORT:-28080}"
    volumes:
      - ./volumes/server/logs:/category-analysis/server/logs
      - ./volumes/server/temp:/category-analysis/server/temp
    networks:
      - category-analysis

networks:
  category-analysis:
    driver: bridge
